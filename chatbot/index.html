<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amabongo Virtual Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="chatbot.css">
</head>
<!-- new design -->

<body>
  <div class="app">
    <section class="chat-wrap">
      <div class="chat">
        <header class="chat-header">
          <div class="logo">
            <i class="ph ph-recycle logo-icon"></i>
          </div>
          <div class="chat-title">
            <h1>
              AMABONGO SOLUTIONS
              <span class="live-dot" role="status" aria-label="Assistant Active"></span>
            </h1>
            <p>Your Smart Glass Recycling Partner</p>
          </div>
        </header>
        <main>
          <div id="messages" class="messages" role="log" aria-live="polite"></div>
          <div id="typing" class="typing hidden" aria-hidden="true" aria-label="Assistant is typing">
            <div class="dots"><span></span><span></span><span></span></div>
          </div>
          <div id="quickbar" class="quickbar" role="group" aria-label="Quick action buttons"></div>
        </main>
        <form id="composer" class="composer" autocomplete="off">
          <label for="input" class="visually-hidden">Type your message</label>
          <input id="input" class="input" type="text" placeholder="Ask about services, materials, rates..." required>
          <button id="send" class="send" type="submit" aria-label="Send message">
            <i class="ph ph-paper-plane-right"></i>
          </button>
        </form>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>

</html>
