<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-feat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071929" />
      <stop offset="40%" stop-color="#0c2a47" />
      <stop offset="80%" stop-color="#082218" />
      <stop offset="100%" stop-color="#05140f" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="gold-feat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFC107" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>

    <!-- Green Emerald Gradient -->
    <linearGradient id="green-feat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>

    <!-- Amber Glass -->
    <linearGradient id="amber-feat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Clear Flint Glass -->
    <linearGradient id="flint-feat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#f0f9ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadow-feat" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glow-gold-feat" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern -->
    <pattern id="grid-feat" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.2" fill="rgba(255,255,255,0.08)" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="600" fill="url(#bg-grad-feat)" />
  <rect width="1000" height="600" fill="url(#grid-feat)" />

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="300" r="260" fill="#0D47A1" opacity="0.18" filter="url(#glow-gold-feat)" />
  <circle cx="750" cy="280" r="240" fill="#2E7D32" opacity="0.16" filter="url(#glow-gold-feat)" />
  <circle cx="500" cy="180" r="140" fill="#FFC107" opacity="0.1" filter="url(#glow-gold-feat)" />

  <!-- Technical Circuit / Map Lines -->
  <path d="M 60,520 L 940,520" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <path d="M 160,80 L 160,520" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="6 6" />
  <path d="M 840,80 L 840,520" stroke="rgba(255,255,255,0.05)" stroke-width="1" stroke-dasharray="6 6" />

  <!-- ==================== LEFT: THE CERTIFIED SCALE & GLASS STREAMS ==================== -->
  <g transform="translate(100, 160)" filter="url(#shadow-feat)">
    <!-- Scale Platform -->
    <polygon points="40,310 380,310 360,340 60,340" fill="#1c252a" />
    <polygon points="50,285 370,285 380,310 40,310" fill="#455A64" stroke="#607D8B" stroke-width="1" />
    <!-- Yellow Platform Edge -->
    <rect x="50" y="285" width="8" height="25" fill="#FFC107" />
    <rect x="362" y="285" width="8" height="25" fill="#FFC107" />

    <!-- Flint Bottle -->
    <g transform="translate(90, 40)">
      <path d="M 20,0 L 32,0 C 33,0 34,2 34,4 L 34,40 C 34,55 46,70 48,88 L 48,240 C 48,244 44,246 38,246 L 14,246 C 8,246 4,244 4,240 L 4,88 C 6,70 18,55 18,40 L 18,4 Z"
            fill="url(#flint-feat)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" />
      <path d="M 8,95 L 8,230" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Amber Bottle -->
    <g transform="translate(170, 15)">
      <path d="M 22,0 L 36,0 C 37,0 38,2 38,4 L 38,45 C 38,65 52,80 54,100 L 54,265 C 54,270 50,272 44,272 L 14,272 C 8,272 4,270 4,265 L 4,100 C 6,80 20,65 20,45 L 20,4 Z"
            fill="url(#amber-feat)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
      <rect x="20" y="-4" width="18" height="6" rx="1" fill="#FFC107" />
      <path d="M 8,110 L 8,255" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Emerald Bottle -->
    <g transform="translate(255, 30)">
      <path d="M 22,0 L 36,0 C 37,0 38,2 38,4 L 38,50 C 38,70 52,90 54,110 L 54,250 C 54,255 50,257 44,257 L 14,257 C 8,257 4,255 4,250 L 4,110 C 6,90 20,70 20,50 L 20,4 Z"
            fill="url(#green-feat)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
      <path d="M 8,115 L 8,240" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Digital Weighbridge Scale Console -->
    <g transform="translate(390, 180)">
      <rect x="0" y="40" width="12" height="90" fill="#37474F" rx="2" />
      <rect x="-35" y="-15" width="85" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" />
      <rect x="-28" y="-8" width="70" height="30" rx="3" fill="#022c22" stroke="#065f46" stroke-width="1" />
      <text x="7" y="13" font-family="'Oswald', sans-serif" font-size="14" font-weight="700" fill="#10b981" text-anchor="middle">
        34.00 T
      </text>
      <text x="7" y="38" font-family="'Roboto', sans-serif" font-size="7" font-weight="700" fill="#94a3b8" text-anchor="middle">
        CERTIFIED NET
      </text>
    </g>

    <!-- Cullet Crystals Base -->
    <polygon points="80,290 95,282 105,292 90,298" fill="#38bdf8" opacity="0.8" />
    <polygon points="120,292 135,284 145,295 130,300" fill="#fbbf24" opacity="0.9" />
    <polygon points="230,290 245,282 255,294 240,298" fill="#4ade80" opacity="0.85" />
    <polygon points="310,290 325,282 335,294 320,298" fill="#fbbf24" opacity="0.85" />
  </g>

  <!-- ==================== RIGHT: MONETIZATION & B2B LOGISTICS ==================== -->
  <g transform="translate(580, 130)" filter="url(#shadow-feat)">
    <!-- Main Valuation Card -->
    <rect x="0" y="0" width="340" height="360" rx="14" fill="#0f2136" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <path d="M 0,14 C 0,6 6,0 14,0 L 326,0 C 334,0 340,6 340,14 L 340,20 L 0,20 Z" fill="#2E7D32" />

    <!-- Rand Coin Medallion -->
    <g transform="translate(170, 95)" filter="url(#glow-gold-feat)">
      <circle cx="0" cy="0" r="44" fill="#C77700" />
      <circle cx="0" cy="0" r="40" fill="url(#gold-feat)" stroke="#FFF9C4" stroke-width="2" />
      <circle cx="0" cy="0" r="33" fill="none" stroke="#8c5300" stroke-width="1.5" stroke-dasharray="3 2" />
      <text x="0" y="16" font-family="'Oswald', sans-serif" font-size="44" font-weight="700" fill="#4a2c00" text-anchor="middle">
        R
      </text>
    </g>

    <!-- Top Headline: 2026 GLASS PAYOUTS -->
    <text x="170" y="172" font-family="'Oswald', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      R600 <tspan font-size="16" font-weight="400" fill="#94a3b8">/ TONNE</tspan>
    </text>
    <text x="170" y="198" font-family="'Roboto', sans-serif" font-size="14" font-weight="500" fill="#FFC107" text-anchor="middle">
      ≈ R0.60/kg Crushed Cullet • Instant Scale Payout
    </text>

    <!-- Divider Line -->
    <line x1="30" y1="220" x2="310" y2="220" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

    <!-- Commercial Logistics Feature Row -->
    <g transform="translate(30, 238)">
      <circle cx="18" cy="18" r="16" fill="rgba(46,125,50,0.2)" stroke="#2E7D32" stroke-width="1" />
      <path d="M 12,18 L 16,22 L 24,14" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="44" y="14" font-family="'Oswald', sans-serif" font-size="13" font-weight="700" fill="#ffffff">
        PMB DEPOT CASH SETTLEMENT
      </text>
      <text x="44" y="28" font-family="'Roboto', sans-serif" font-size="10" font-weight="400" fill="#94a3b8">
        Drop off unwashed &amp; unsorted at Mkondeni
      </text>
    </g>

    <g transform="translate(30, 285)">
      <circle cx="18" cy="18" r="16" fill="rgba(37,99,235,0.2)" stroke="#2563eb" stroke-width="1" />
      <path d="M 10,18 L 26,18 M 20,12 L 26,18 L 20,24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="44" y="14" font-family="'Oswald', sans-serif" font-size="13" font-weight="700" fill="#ffffff">
        34-TONNE COMMERCIAL PICKUPS
      </text>
      <text x="44" y="28" font-family="'Roboto', sans-serif" font-size="10" font-weight="400" fill="#94a3b8">
        Scheduled hospitality &amp; industrial routes across SA
      </text>
    </g>
  </g>

  <!-- Top Banner Tag -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="280" height="34" rx="6" fill="#FFC107" />
    <text x="18" y="22" font-family="'Oswald', sans-serif" font-size="14" font-weight="700" fill="#212529" letter-spacing="1">
      FEATURED MARKET PAYOUT GUIDE 2026
    </text>
  </g>
</svg>
