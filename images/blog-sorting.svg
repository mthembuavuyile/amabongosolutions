<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-sorting" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081e14" />
      <stop offset="50%" stop-color="#0d2e20" />
      <stop offset="100%" stop-color="#091b12" />
    </linearGradient>

    <!-- Glass Bottle Shaders -->
    <!-- 1. Flint / Clear -->
    <linearGradient id="stream-flint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#e0f2fe" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#bae6fd" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.75" />
    </linearGradient>

    <!-- 2. Amber / Brown -->
    <linearGradient id="stream-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#b45309" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#d97706" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.95" />
    </linearGradient>

    <!-- 3. Emerald / Green -->
    <linearGradient id="stream-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14532d" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#16a34a" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#22c55e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#052e16" stop-opacity="0.95" />
    </linearGradient>

    <!-- 1-Tonne Bulk Bag Woven Texture Fabric -->
    <linearGradient id="bag-fabric" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Woven Grid Pattern -->
    <pattern id="woven-pattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="rgba(0,0,0,0.03)" />
      <rect x="4" y="4" width="4" height="4" fill="rgba(0,0,0,0.03)" />
      <line x1="0" y1="0" x2="8" y2="8" stroke="rgba(0,0,0,0.02)" stroke-width="0.5" />
    </pattern>

    <!-- Tech Grid Background Pattern -->
    <pattern id="grid-dots-sort" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="rgba(255,255,255,0.06)" />
    </pattern>

    <!-- Filters -->
    <filter id="shadow-sort" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="480" fill="url(#bg-grad-sorting)" />
  <rect width="800" height="480" fill="url(#grid-dots-sort)" />

  <!-- Ambient Color Glows -->
  <circle cx="240" cy="240" r="180" fill="#2E7D32" opacity="0.15" filter="url(#glow-emerald)" />
  <circle cx="620" cy="260" r="170" fill="#FFC107" opacity="0.1" filter="url(#glow-emerald)" />

  <!-- Ground Shadow Base -->
  <ellipse cx="230" cy="400" rx="190" ry="18" fill="#040e09" opacity="0.7" />
  <ellipse cx="610" cy="405" rx="130" ry="16" fill="#040e09" opacity="0.7" />

  <!-- ==================== LEFT: THE 3 COLOR-SORTED GLASS BOTTLES ==================== -->
  <g transform="translate(40, 100)" filter="url(#shadow-sort)">

    <!-- Pedestal Base for the 3 Bottles -->
    <rect x="20" y="275" width="340" height="20" rx="4" fill="#0f261c" stroke="#1d4d38" stroke-width="1.5" />
    <line x1="20" y1="280" x2="360" y2="280" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

    <!-- 1. CLEAR / FLINT BOTTLE (Left) -->
    <g transform="translate(45, 30)">
      <!-- Bottle Path -->
      <path d="M 22,0 L 36,0 C 37,0 38,2 38,5 L 38,40 C 38,55 52,70 54,88 L 54,235 C 54,240 50,242 44,242 L 14,242 C 8,242 4,240 4,235 L 4,88 C 6,70 20,55 20,40 L 20,5 C 20,2 21,0 22,0 Z"
            fill="url(#stream-flint)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" />
      <!-- Base Thickness Line -->
      <rect x="5" y="222" width="48" height="18" fill="rgba(255,255,255,0.25)" rx="1" />
      <!-- Highlight Reflection -->
      <path d="M 10,95 L 10,225" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 16,105 L 16,215" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" stroke-linecap="round" />
      <!-- Color Label Tag -->
      <rect x="-10" y="250" width="78" height="20" rx="4" fill="#0284c7" />
      <text x="29" y="264" font-family="'Oswald', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
        FLINT (CLEAR)
      </text>
    </g>

    <!-- 2. AMBER / BROWN BOTTLE (Center) -->
    <g transform="translate(155, 10)">
      <!-- Bottle Path -->
      <path d="M 24,0 L 40,0 C 41,0 42,2 42,5 L 42,45 C 42,65 58,80 60,100 L 60,255 C 60,260 56,262 50,262 L 14,262 C 8,262 4,260 4,255 L 4,100 C 6,80 22,65 22,45 L 22,5 C 22,2 23,0 24,0 Z"
            fill="url(#stream-amber)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
      <rect x="22" y="-4" width="20" height="6" rx="1" fill="#FFC107" />
      <!-- Body Highlights -->
      <path d="M 10,110 L 10,245" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round" />
      <!-- Color Label Tag -->
      <rect x="-8" y="270" width="80" height="20" rx="4" fill="#b45309" />
      <text x="32" y="284" font-family="'Oswald', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
        AMBER (BROWN)
      </text>
    </g>

    <!-- 3. EMERALD / GREEN BOTTLE (Right) -->
    <g transform="translate(265, 25)">
      <!-- Wine Bottle Path -->
      <path d="M 22,0 L 36,0 C 37,0 38,2 38,5 L 38,50 C 38,70 54,90 56,110 L 56,240 C 56,245 52,247 46,247 L 14,247 C 8,247 4,245 4,240 L 4,110 C 6,90 22,70 22,50 L 22,5 C 22,2 23,0 24,0 Z"
            fill="url(#stream-emerald)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
      <path d="M 22,0 L 38,0 L 38,20 L 22,20 Z" fill="#b91c1c" />
      <!-- Body Highlights -->
      <path d="M 10,120 L 10,230" stroke="rgba(255,255,255,0.45)" stroke-width="2.5" stroke-linecap="round" />
      <!-- Color Label Tag -->
      <rect x="-10" y="255" width="80" height="20" rx="4" fill="#15803d" />
      <text x="30" y="269" font-family="'Oswald', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
        EMERALD (GREEN)
      </text>
    </g>
  </g>

  <!-- Circular Color-Sorting Arrow Ring Around Bottles -->
  <g transform="translate(230, 240)">
    <circle cx="0" cy="0" r="170" fill="none" stroke="rgba(76,175,80,0.2)" stroke-width="2" stroke-dasharray="10 8" />
  </g>

  <!-- ==================== RIGHT: 1-TONNE WOVEN BULK BAG (AMASAKA) ==================== -->
  <g transform="translate(480, 140)" filter="url(#shadow-sort)">

    <!-- Four Heavy-Duty Lifting Loops -->
    <!-- Loop 1 (Back Left) -->
    <path d="M 30,50 C 30,-15 55,-15 55,50" fill="none" stroke="#2563eb" stroke-width="9" stroke-linecap="round" />
    <path d="M 30,50 C 30,-15 55,-15 55,50" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
    <!-- Loop 2 (Back Right) -->
    <path d="M 205,50 C 205,-15 230,-15 230,50" fill="none" stroke="#2563eb" stroke-width="9" stroke-linecap="round" />
    <path d="M 205,50 C 205,-15 230,-15 230,50" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />

    <!-- Bulk Bag Body (Technical 1-Tonne Square Bag) -->
    <rect x="20" y="50" width="220" height="210" rx="10" fill="url(#bag-fabric)" stroke="#94a3b8" stroke-width="2" />
    <rect x="20" y="50" width="220" height="210" rx="10" fill="url(#woven-pattern)" />

    <!-- Loop 3 & 4 (Front Loops attached with heavy stitch plates) -->
    <rect x="28" y="50" width="22" height="40" rx="2" fill="#1d4ed8" />
    <path d="M 25,65 C 25,10 45,10 45,65" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" />
    <rect x="210" y="50" width="22" height="40" rx="2" fill="#1d4ed8" />
    <path d="M 215,65 C 215,10 235,10 235,65" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round" />

    <!-- Cross Reinforcement Seam Lines -->
    <line x1="20" y1="120" x2="240" y2="120" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 2" />
    <line x1="20" y1="180" x2="240" y2="180" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 2" />

    <!-- Industrial Safe Working Load (SWL) Badge on Bag -->
    <rect x="45" y="130" width="170" height="90" rx="6" fill="#0f172a" stroke="#2E7D32" stroke-width="2" />
    <text x="130" y="152" font-family="'Oswald', sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="middle" letter-spacing="1">
      1-TONNE BULK BAG (AMASAKA)
    </text>
    <text x="130" y="180" font-family="'Oswald', sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">
      1,000 KG
    </text>
    <text x="130" y="202" font-family="'Roboto', sans-serif" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
      SWL 1000KG • WOVEN POLYPROPYLENE
    </text>

    <!-- Cullet Gems Overflowing Top of Bag -->
    <g transform="translate(30, 20)">
      <polygon points="50,25 65,15 78,28 60,35" fill="#4ade80" opacity="0.9" />
      <polygon points="75,20 90,8 105,22 88,32" fill="#facc15" opacity="0.95" />
      <polygon points="100,24 118,12 130,26 112,36" fill="#38bdf8" opacity="0.85" />
      <polygon points="125,18 140,6 155,20 138,30" fill="#4ade80" opacity="0.9" />
      <polygon points="150,22 165,10 178,24 162,34" fill="#fb923c" opacity="0.9" />
    </g>
  </g>

  <!-- ==================== HEADER BADGES & REASSURANCE ==================== -->

  <!-- Top Left Section Badge -->
  <g transform="translate(45, 45)">
    <rect x="0" y="0" width="220" height="28" rx="6" fill="#2E7D32" />
    <text x="14" y="18" font-family="'Oswald', sans-serif" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">
      PREPARATION &amp; COLOR SORTING
    </text>
  </g>

  <!-- Top Right Trust Badge: WE BUY UNWASHED & UNSORTED -->
  <g transform="translate(490, 45)" filter="url(#shadow-sort)">
    <rect x="0" y="0" width="265" height="55" rx="8" fill="#132a1d" stroke="#22c55e" stroke-width="1.5" />
    <!-- Checkmark Icon -->
    <circle cx="28" cy="28" r="14" fill="#22c55e" />
    <path d="M 22,28 L 26,32 L 34,23" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="52" y="24" font-family="'Oswald', sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      WE BUY UNWASHED GLASS!
    </text>
    <text x="52" y="42" font-family="'Roboto', sans-serif" font-size="10" font-weight="500" fill="#86efac">
      No cleaning required • Drop off as-is
    </text>
  </g>

  <!-- Bottom Quality Verification Bar -->
  <g transform="translate(240, 435)">
    <rect x="0" y="-12" width="320" height="26" rx="13" fill="rgba(8,30,20,0.85)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    <text x="160" y="5" font-family="'Roboto', sans-serif" font-size="10" font-weight="600" fill="#cbd5e1" text-anchor="middle">
      FLINT <tspan fill="#4ade80">•</tspan> AMBER <tspan fill="#facc15">•</tspan> EMERALD <tspan fill="#4ade80">•</tspan> COLOR SORT = MAX PAYOUT
    </text>
  </g>
</svg>
